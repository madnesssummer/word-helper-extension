<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>单词助手 - 周总结</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 28px;
        color: #1d2433;
        font-family: ui-rounded, system-ui, -apple-system, "SF Pro Text", Segoe UI, sans-serif;
        background:
          radial-gradient(circle at 12% 8%, rgba(255,106,136,.3), transparent 34%),
          radial-gradient(circle at 90% 12%, rgba(79,172,254,.3), transparent 38%),
          linear-gradient(145deg, #f3efff, #e8f5ff);
      }
      .shell {
        width: min(900px, 100%);
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.82);
        border-radius: 28px;
        background: rgba(255,255,255,.72);
        box-shadow: 0 24px 70px rgba(66,56,110,.16);
        backdrop-filter: blur(28px) saturate(170%);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 28px;
        color: #fff;
        background: linear-gradient(120deg, #ff5f7e, #9c5de8 52%, #368ee8);
      }
      h1 { margin: 0; font-size: 26px; letter-spacing: -.4px; }
      .week-range { margin-top: 5px; color: rgba(255,255,255,.82); font-size: 13px; }
      .close {
        padding: 9px 16px;
        border: 1px solid rgba(255,255,255,.3);
        border-radius: 999px;
        background: rgba(255,255,255,.18);
        color: #fff;
        cursor: pointer;
        font-weight: 650;
      }
      main { padding: 28px; }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 15px;
      }
      .stat {
        padding: 22px;
        border: 1px solid rgba(115,95,170,.1);
        border-radius: 20px;
        background: rgba(255,255,255,.72);
        box-shadow: 0 10px 26px rgba(68,56,112,.08);
        text-align: center;
      }
      .stat-icon { font-size: 24px; }
      .stat-value { margin: 5px 0 2px; color: #7856d8; font-size: 34px; font-weight: 800; }
      .stat-label { color: #6b7280; font-size: 13px; font-weight: 650; }
      .review {
        margin-top: 20px;
        padding: 24px;
        border-radius: 22px;
        color: #fff;
        background:
          radial-gradient(circle at 88% 8%, rgba(255,255,255,.18), transparent 34%),
          linear-gradient(135deg, #272750, #633d91 52%, #a74172);
        box-shadow: 0 18px 42px rgba(63,42,105,.2);
      }
      .review-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .review h2 { margin: 0; font-size: 19px; }
      .regenerate {
        padding: 8px 13px;
        border: 1px solid rgba(255,255,255,.3);
        border-radius: 999px;
        background: rgba(255,255,255,.14);
        color: #fff;
        cursor: pointer;
        font-weight: 650;
      }
      .regenerate:disabled { opacity: .5; cursor: wait; }
      .review-text {
        min-height: 86px;
        margin: 18px 0 0;
        color: rgba(255,255,255,.92);
        font-size: 16px;
        line-height: 1.85;
        white-space: pre-wrap;
      }
      .review-text.loading { opacity: .68; animation: pulse 1.1s ease-in-out infinite alternate; }
      .review-text.error { color: #ffd4dc; }
      .detail {
        margin-top: 18px;
        color: #73778a;
        font-size: 12px;
        text-align: center;
      }
      @keyframes pulse { to { opacity: .35; } }
      @media (max-width: 640px) {
        body { padding: 12px; }
        header, main { padding: 20px; }
        .stats { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <h1>⚡ 本周学习锐评</h1>
          <div class="week-range" id="weekRange">正在统计...</div>
        </div>
        <button class="close" type="button" id="closeBtn">返回</button>
      </header>
      <main>
        <section class="stats">
          <article class="stat">
            <div class="stat-icon">🔎</div>
            <div class="stat-value" id="queryCount">0</div>
            <div class="stat-label">查询单词</div>
          </article>
          <article class="stat">
            <div class="stat-icon">♥️</div>
            <div class="stat-value" id="favoriteCount">0</div>
            <div class="stat-label">收藏单词</div>
          </article>
          <article class="stat">
            <div class="stat-icon">🧠</div>
            <div class="stat-value" id="reviewCount">0</div>
            <div class="stat-label">复习单词</div>
          </article>
        </section>

        <section class="review">
          <div class="review-head">
            <h2>DeepSeek 锐评</h2>
            <button class="regenerate" id="regenerateBtn" type="button">再锐评一次</button>
          </div>
          <p class="review-text loading" id="reviewText">DeepSeek 正在翻你的学习账本...</p>
        </section>
        <div class="detail">统计周期为本周一至本周日；同一单词按独立单词计数。</div>
      </main>
    </div>
    <script src="weekly-summary.js"></script>
  </body>
</html>
